# Creates a GitHub Release whenever the default branch carries a manifest
# version that hasn't been released yet. HACS offers updates based on
# releases, so bumping "version" in manifest.json and pushing to the
# default branch is all a release takes. Also runnable by hand from the
# Actions tab (workflow_dispatch).
name: Release

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pushes to other branches and tags are skipped, so this keeps working
    # if the default branch is ever renamed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read manifest version
        id: version
        run: |
          manifest=custom_components/yaml_editor/manifest.json
          version=$(jq -r .version "$manifest")
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No version found in $manifest"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
